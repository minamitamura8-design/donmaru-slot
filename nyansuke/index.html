<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>にゃんすけ神経衰弱</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fffaf0;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#51331f}.game{max-width:430px;margin:auto;padding:10px;background:linear-gradient(#fff9e9,#fff2cd,#fff8e8);min-height:100vh}.header{position:relative;min-height:82px;padding:10px 72px 0;text-align:center}.title{font-size:27px;font-weight:950;white-space:nowrap;color:#5a351c}.sub{font-size:12px;font-weight:850;margin-top:7px}.corner{position:absolute;width:68px;height:68px;object-fit:contain;background:#fff;border-radius:14px;padding:2px}.tl{left:0;top:3px}.tr{right:0;top:3px}.stats{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0 9px}.stat{height:44px;border:2px solid #ce9630;background:#fff6dc;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:950}.reset{border:0;border-radius:15px;background:#ec762d;color:white;font-weight:950;padding:0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{aspect-ratio:1/1.02;border:0;padding:0;background:none;perspective:900px}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:.28s}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;backface-visibility:hidden;border-radius:14px;overflow:hidden;border:3px solid #b97d23}.front{align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#ffd65a 0 9px,#ffe681 9px 18px)}.clover{width:62%;aspect-ratio:1;border-radius:50%;background:#fff8dd;display:flex;align-items:center;justify-content:center;font-size:46px}.back{transform:rotateY(180deg);background:white;padding:8px;align-items:center;justify-content:center}.back img{width:82%;height:82%;object-fit:contain}.footer{position:relative;height:76px;margin-top:10px}.footer .corner{top:4px}.bl{left:0}.br{right:0}.msg{position:absolute;left:74px;right:74px;top:17px;min-height:38px;border:2px solid #d6a13b;background:#fff5d5;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:13px}</style></head><body><main class="game"><header class="header"><img class="corner tl" src="assets/corner1.jpg"><img class="corner tr" src="assets/corner2.jpg"><div class="title">にゃんすけ神経衰弱 🍡</div><div class="sub">おなじにゃんすけを見つけてね！</div></header><section class="stats"><div class="stat">手数&nbsp;<span id="moves">0</span></div><div class="stat">ペア&nbsp;<span id="pairs">0</span>/6</div><button id="reset" class="reset">もう一度</button></section><section id="grid" class="grid"></section><footer class="footer"><img class="corner bl" src="assets/corner3.jpg"><div id="msg" class="msg">🍀 カードをめくってね</div><img class="corner br" src="assets/corner4.jpg"></footer></main><audio id="flipA" preload="auto" playsinline></audio><audio id="missA" preload="auto" playsinline></audio><audio id="matchA" preload="auto" playsinline></audio><audio id="fanA" preload="auto" playsinline></audio><audio id="resetA" preload="auto" playsinline></audio><script>(()=>{const sr=22050,cl=x=>Math.max(-1,Math.min(1,x)),wav=x=>{const b=new ArrayBuffer(44+x.length*2),v=new DataView(b),s=(o,z)=>{for(let i=0;i<z.length;i++)v.setUint8(o+i,z.charCodeAt(i))};s(0,'RIFF');v.setUint32(4,36+x.length*2,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,'data');v.setUint32(40,x.length*2,true);for(let i=0;i<x.length;i++)v.setInt16(44+i*2,Math.round(cl(x[i])*.92*32767),true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))};function notes(seq,total){const n=sr*total|0,a=new Float32Array(n);seq.forEach(q=>{let hz=q[0],st=q[1],d=q[2],amp=q[3],o=st*sr|0,L=Math.min(d*sr|0,n-o);for(let i=0;i<L;i++){let t=i/sr,e=Math.min(1,t/.008)*Math.exp(-t*8),p=2*Math.PI*hz*t;a[o+i]+=amp*e*(Math.sin(p)+.28*Math.sin(2*p))}});return a}const FA=document.querySelector('#flipA'),MI=document.querySelector('#missA'),MA=document.querySelector('#matchA'),FN=document.querySelector('#fanA'),RA=document.querySelector('#resetA');FA.src=wav(notes([[760,0,.08,.28]],.10));MI.src=wav(notes([[330,0,.13,.25],[220,.09,.18,.25]],.30));MA.src=wav(notes([[660,0,.12,.24],[880,.08,.14,.24],[1100,.17,.20,.25]],.40));RA.src=wav(notes([[520,0,.09,.22],[760,.07,.14,.23]],.25));FN.src=wav(notes([[523,0,.22,.22],[659,.10,.22,.22],[784,.20,.22,.22],[1047,.30,.28,.24],[1319,.42,.30,.25],[1568,.56,.55,.28]],1.18));const play=a=>{try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}};const g=document.getElementById('grid'),me=document.getElementById('moves'),pe=document.getElementById('pairs'),msg=document.getElementById('msg');for(let n=0;n<12;n++){let i=n%6,b=document.createElement('button');b.className='card';b.dataset.id=i;b.innerHTML='<span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face'+(i+1)+'.jpg"></span></span>';g.appendChild(b)}let f=null,s=null,l=false,m=0,p=0,t=null;function sh(){let a=[...g.children];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.forEach(c=>g.appendChild(c))}function R(sound){if(t)clearTimeout(t);f=s=null;l=false;m=p=0;me.textContent=pe.textContent='0';msg.textContent='🍀 カードをめくってね';[...g.children].forEach(c=>{c.classList.remove('open','matched');c.disabled=false});sh();if(sound)play(RA)}function F(c){if(l||c===f||c.classList.contains('matched'))return;play(FA);c.classList.add('open');if(!f){f=c;return}s=c;l=true;me.textContent=++m;if(f.dataset.id===s.dataset.id){f.classList.add('matched');s.classList.add('matched');f.disabled=s.disabled=true;pe.textContent=++p;f=s=null;l=false;if(p===6){msg.textContent='🎉 ぜんぶそろった！';play(FN)}else{msg.textContent='🍀 おそろい！';play(MA)}}else{play(MI);let a=f,b=s;t=setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');f=s=null;l=false;msg.textContent='🍀 カードをめくってね'},800)}}[...g.children].forEach(c=>c.addEventListener('click',()=>F(c)));document.getElementById('reset').addEventListener('click',()=>R(true));R(false)})();</script></body></html>
