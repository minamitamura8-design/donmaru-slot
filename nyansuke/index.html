<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>にゃんすけ神経衰弱</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fffaf0;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#51331f}.game{max-width:430px;margin:auto;padding:10px;background:linear-gradient(#fff9e9,#fff2cd,#fff8e8);min-height:100vh}.header{position:relative;min-height:82px;padding:10px 72px 0;text-align:center}.title{font-size:27px;font-weight:950;white-space:nowrap;color:#5a351c}.sub{font-size:12px;font-weight:850;margin-top:7px}.corner{position:absolute;width:68px;height:68px;object-fit:contain;background:#fff;border-radius:14px;padding:2px}.tl{left:0;top:3px}.tr{right:0;top:3px}.stats{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0 9px}.stat{height:44px;border:2px solid #ce9630;background:#fff6dc;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:950}.reset{border:0;border-radius:15px;background:#ec762d;color:white;font-weight:950;padding:0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{aspect-ratio:1/1.02;border:0;padding:0;background:none;perspective:900px}.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:.28s}.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;backface-visibility:hidden;border-radius:14px;overflow:hidden;border:3px solid #b97d23}.front{align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#ffd65a 0 9px,#ffe681 9px 18px)}.clover{width:62%;aspect-ratio:1;border-radius:50%;background:#fff8dd;display:flex;align-items:center;justify-content:center;font-size:46px}.back{transform:rotateY(180deg);background:white;padding:8px;align-items:center;justify-content:center}.back img{width:88%;height:88%;object-fit:contain}.footer{position:relative;height:76px;margin-top:10px}.footer .corner{top:4px}.bl{left:0}.br{right:0}.msg{position:absolute;left:74px;right:74px;top:17px;min-height:38px;border:2px solid #d6a13b;background:#fff5d5;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:13px}</style></head><body><main class="game"><header class="header"><img class="corner tl" src="assets/corner1.jpg"><img class="corner tr" src="assets/corner2.jpg"><div class="title">にゃんすけ神経衰弱 🍡</div><div class="sub">おなじにゃんすけを見つけてね！</div></header><section class="stats"><div class="stat">手数&nbsp;<span id="moves">0</span></div><div class="stat">ペア&nbsp;<span id="pairs">0</span>/6</div><button id="reset" class="reset">もう一度</button></section><section id="grid" class="grid"></section><footer class="footer"><img class="corner bl" src="assets/corner3.jpg"><div id="msg" class="msg">🍀 カードをめくってね</div><img class="corner br" src="assets/corner4.jpg"></footer></main><script>const g=document.getElementById('grid'),me=document.getElementById('moves'),pe=document.getElementById('pairs'),msg=document.getElementById('msg');for(let n=0;n<12;n++){let i=n%6,b=document.createElement('button');b.className='card';b.dataset.id=i;b.innerHTML='<span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face'+(i+1)+'.jpg"></span></span>';g.appendChild(b)}let f=null,s=null,l=false,m=0,p=0,t=null,ac=null;function audio(){let C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!ac)ac=new C();if(ac.state==='suspended')ac.resume();return ac}function tone(q,d,z=0,v=.08){let a=audio();if(!a)return;let o=a.createOscillator(),x=a.createGain(),u=a.currentTime+z;o.type='triangle';o.frequency.setValueAtTime(q,u);x.gain.setValueAtTime(.001,u);x.gain.exponentialRampToValueAtTime(v,u+.01);x.gain.exponentialRampToValueAtTime(.001,u+d);o.connect(x);x.connect(a.destination);o.start(u);o.stop(u+d+.03)}function flipSound(){tone(700,.08)}function missSound(){tone(330,.12);tone(220,.18,.09)}function matchSound(){tone(660,.12);tone(880,.14,.08);tone(1100,.18,.17)}function fanfare(){[523,659,784,1047,1319].forEach((q,i)=>tone(q,.24,i*.11,.1));tone(1568,.5,.58,.12)}function restartSound(){tone(520,.08);tone(760,.12,.07)}function shuffle(){let a=[...g.children];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.forEach(c=>g.appendChild(c))}function reset(sound){if(t)clearTimeout(t);f=s=null;l=false;m=p=0;me.textContent=pe.textContent='0';msg.textContent='🍀 カードをめくってね';[...g.children].forEach(c=>{c.classList.remove('open','matched');c.disabled=false});shuffle();if(sound)restartSound()}function flip(c){audio();if(l||c===f||c.classList.contains('matched'))return;flipSound();c.classList.add('open');if(!f){f=c;return}s=c;l=true;me.textContent=++m;if(f.dataset.id===s.dataset.id){f.classList.add('matched');s.classList.add('matched');f.disabled=s.disabled=true;pe.textContent=++p;f=s=null;l=false;if(p===6){msg.textContent='🎉 ぜんぶそろった！';fanfare()}else{msg.textContent='🍀 おそろい！';matchSound()}}else{missSound();let a=f,b=s;t=setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');f=s=null;l=false;msg.textContent='🍀 カードをめくってね'},800)}}[...g.children].forEach(c=>c.addEventListener('click',()=>flip(c)));document.getElementById('reset').addEventListener('click',()=>{audio();reset(true)});reset(false)</script></body></html>
