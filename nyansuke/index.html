<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4c44f">
<title>にゃんすけ神経衰弱</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fffaf0;color:#51331f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100vh}
.game{width:min(100%,430px);margin:auto;min-height:100vh;padding:10px;background:linear-gradient(180deg,#fff9e9 0%,#fff2cd 54%,#fff8e8 100%);overflow:hidden}
.header{position:relative;min-height:74px;padding:9px 50px 0;text-align:center}
.title{font-size:clamp(23px,6.5vw,28px);line-height:1.05;font-weight:950;white-space:nowrap;color:#5a351c;text-shadow:0 2px 0 rgba(255,247,207,.9);letter-spacing:-.04em}
.title .dango{font-size:.78em;vertical-align:.08em;margin-left:2px}
.sub{margin-top:7px;font-size:12px;font-weight:850;color:#704824;white-space:nowrap}
.corner{position:absolute;width:52px;height:52px;object-fit:contain;background:#fff;border-radius:14px;padding:2px}
.tl{left:2px;top:5px} .tr{right:2px;top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:4px 0 9px}
.stat{min-height:44px;border:2px solid #ce9630;background:#fff6dc;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:14px;box-shadow:0 2px 0 rgba(143,86,18,.10)}
.reset{min-height:44px;border:0;border-radius:15px;background:#ec762d;color:#fff;font-weight:950;padding:0 12px;font-size:14px;box-shadow:0 3px 0 rgba(152,67,18,.22)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{aspect-ratio:1/1.02;border:0;padding:0;background:transparent;perspective:900px;border-radius:14px;min-width:0}
.inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;backface-visibility:hidden;border-radius:14px;overflow:hidden;border:3px solid #b97d23;box-shadow:0 3px 0 rgba(113,70,21,.23)}
.front{align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#ffd65a 0 9px,#ffe681 9px 18px)}
.clover{width:62%;aspect-ratio:1;border-radius:50%;background:#fff8dd;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10.5vw,47px);box-shadow:inset 0 0 0 2px #e9bd4d}
.back{transform:rotateY(180deg);background:#fffaf0;padding:4px;align-items:center;justify-content:center}
.back img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px;background:white}
.footer{position:relative;height:58px;margin-top:7px}
.footer .corner{top:4px} .bl{left:2px} .br{right:2px}
.msg{position:absolute;left:58px;right:58px;top:9px;min-height:38px;border-radius:999px;background:#fff5d5;border:2px solid #d6a13b;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:950;padding:4px 8px}
.card.matched{animation:pop .42s ease} .card.wrong{animation:shake .32s ease}
@keyframes pop{50%{transform:translateY(-6px) scale(1.04)}}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
@media(max-width:360px){.game{padding:8px}.header{padding-left:48px;padding-right:48px}.corner{width:48px;height:48px}.grid{gap:5px}.reset{padding:0 9px}}
.card[data-id="0"] .back img{transform:translateX(-15%)}
.card[data-id="1"] .back img{transform:translateX(-9%)}
.card[data-id="2"] .back img{transform:translateX(0)}
.card[data-id="3"] .back img{transform:translate(11%,6%)}
.card[data-id="4"] .back img{transform:translate(11%,4%)}
.card[data-id="5"] .back img{transform:translateX(1%)}
</style>
</head>
<body>
<main class="game">
<header class="header">
  <img class="corner tl" src="assets/corner1.jpg" alt="にゃんすけ">
  <img class="corner tr" src="assets/corner2.jpg" alt="にゃんすけ">
  <div class="title">にゃんすけ神経衰弱 <span class="dango">🍡</span></div>
  <div class="sub">おなじにゃんすけを見つけてね！</div>
</header>
<section class="stats">
  <div class="stat">手数&nbsp;<span id="moves">0</span></div>
  <div class="stat">ペア&nbsp;<span id="pairs">0</span>/6</div>
  <button id="reset" class="reset" type="button">もう一度</button>
</section>
<section id="grid" class="grid" aria-label="にゃんすけ神経衰弱 12枚">
<button class="card" type="button" data-id="0" aria-label="カード 1"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face1.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="1" aria-label="カード 2"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face2.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="2" aria-label="カード 3"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face3.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="3" aria-label="カード 4"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face4.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="4" aria-label="カード 5"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face5.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="5" aria-label="カード 6"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face6.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="0" aria-label="カード 7"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face1.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="1" aria-label="カード 8"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face2.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="2" aria-label="カード 9"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face3.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="3" aria-label="カード 10"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face4.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="4" aria-label="カード 11"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face5.jpg" alt="にゃんすけ"></span></span></button><button class="card" type="button" data-id="5" aria-label="カード 12"><span class="inner"><span class="face front"><span class="clover">🍀</span></span><span class="face back"><img src="assets/face6.jpg" alt="にゃんすけ"></span></span></button>
</section>
<footer class="footer">
  <img class="corner bl" src="assets/corner3.jpg" alt="にゃんすけ">
  <div id="msg" class="msg" aria-live="polite">🍀 カードをめくってね</div>
  <img class="corner br" src="assets/corner4.jpg" alt="にゃんすけ">
</footer>
</main>
<script>
(function(){
  const grid=document.getElementById('grid');
  const movesEl=document.getElementById('moves');
  const pairsEl=document.getElementById('pairs');
  const msg=document.getElementById('msg');
  const resetBtn=document.getElementById('reset');
  const cards=Array.from(grid.querySelectorAll('.card'));
  let first=null, second=null, locked=false, moves=0, pairs=0, timer=null;
  function shuffle(){const arr=Array.from(grid.children);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}arr.forEach(c=>grid.appendChild(c));}
  function clearPending(){if(timer!==null){clearTimeout(timer);timer=null;}}
  function resetGame(){clearPending();first=null;second=null;locked=false;moves=0;pairs=0;movesEl.textContent='0';pairsEl.textContent='0';msg.textContent='🍀 カードをめくってね';cards.forEach(c=>{c.classList.remove('open','matched','wrong');c.disabled=false;});shuffle();}
  function flip(card){if(locked||card===first||card.classList.contains('matched'))return;card.classList.add('open');if(first===null){first=card;msg.textContent='もう1枚めくってね';return;}second=card;locked=true;moves++;movesEl.textContent=String(moves);if(first.dataset.id===second.dataset.id){first.classList.add('matched');second.classList.add('matched');first.disabled=true;second.disabled=true;pairs++;pairsEl.textContent=String(pairs);msg.textContent='🍀 おそろい！';first=null;second=null;locked=false;if(pairs===6){msg.textContent='🎉 ぜんぶそろった！ '+moves+'手でクリア！';}}else{first.classList.add('wrong');second.classList.add('wrong');msg.textContent='おしい！';const a=first,b=second;timer=setTimeout(function(){a.classList.remove('open','wrong');b.classList.remove('open','wrong');first=null;second=null;locked=false;timer=null;msg.textContent='🍀 カードをめくってね';},800);}}
  cards.forEach(card=>card.addEventListener('click',()=>flip(card)));
  resetBtn.addEventListener('click',resetGame);
  resetGame();
})();
</script>
</body>
</html>
