<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>にゃんすけ神経衰弱</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif}body{display:flex;justify-content:center}.wrap{width:min(100%,430px);min-height:100vh;padding:10px 12px 28px;background:#fff}.heroWrap{position:relative;width:100%}.hero{display:block;width:100%;height:auto;object-fit:contain}.startHit{position:absolute;left:21.1%;top:79.4%;width:57.8%;height:11.2%;border-radius:999px;text-decoration:none}</style></head><body><main class="wrap"><div class="heroWrap"><img class="hero" src="nyansuke_opening_adopted.jpg" alt="にゃんすけ神経衰弱"><a id="startHit" class="startHit" href="index.html" aria-label="スタート"></a></div></main><script>(()=>{const b=document.getElementById('startHit');b.addEventListener('click',e=>{e.preventDefault();const go=()=>location.href='index.html';try{const A=window.AudioContext||window.webkitAudioContext,C=new A(),g=C.createGain();g.connect(C.destination);g.gain.setValueAtTime(.0001,C.currentTime);g.gain.exponentialRampToValueAtTime(.28,C.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,C.currentTime+.42);[[659.25,0],[783.99,.08],[1046.5,.16],[1318.51,.24]].forEach(([f,t])=>{const o=C.createOscillator(),og=C.createGain();o.type='triangle';o.frequency.value=f;og.gain.setValueAtTime(.0001,C.currentTime+t);og.gain.exponentialRampToValueAtTime(.75,C.currentTime+t+.01);og.gain.exponentialRampToValueAtTime(.0001,C.currentTime+t+.16);o.connect(og);og.connect(g);o.start(C.currentTime+t);o.stop(C.currentTime+t+.18)});setTimeout(go,430)}catch(_){go()}})})();</script></body></html>
